<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartAgri - MySQL Web App</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-6">
    <div class="max-w-4xl mx-auto bg-white p-6 rounded-lg shadow-md">
        <h1 class="text-2xl font-bold text-green-700 mb-4">🌾 SmartAgri Queue & Payment Tracker</h1>

        <!-- Booking Form -->
        <form id="bookingForm" class="grid grid-cols-2 gap-4 mb-6 bg-gray-50 p-4 rounded-lg">
            <input type="text" id="name" placeholder="Farmer Name" required class="p-2 border rounded">
            <input type="text" id="crop" placeholder="Crop Type (e.g., Wheat)" required class="p-2 border rounded">
            <input type="number" id="quantityKg" placeholder="Quantity in Kg" required class="p-2 border rounded">
            <input type="text" id="slotTime" placeholder="Slot Time (e.g., 10 AM - 11 AM)" required class="p-2 border rounded">
            <button type="submit" class="col-span-2 bg-green-600 text-white p-2 rounded font-bold hover:bg-green-700">Book Slot</button>
        </form>

        <div id="msg" class="mb-4 text-sm font-semibold"></div>

        <!-- Queue Table -->
        <h2 class="text-xl font-semibold mb-2">Live Database Queue</h2>
        <table class="w-full border-collapse border border-gray-300 text-left text-sm">
            <thead>
                <tr class="bg-gray-200">
                    <th class="border p-2">ID</th>
                    <th class="border p-2">Name</th>
                    <th class="border p-2">Crop</th>
                    <th class="border p-2">Qty (Kg)</th>
                    <th class="border p-2">Slot</th>
                    <th class="border p-2">Status</th>
                    <th class="border p-2">Payment</th>
                </tr>
            </thead>
            <tbody id="queueTable">
                <!-- Data loaded dynamically -->
            </tbody>
        </table>
    </div>

    <script>
        async function fetchQueue() {
            try {
                const res = await fetch('/api/queue');
                const data = await res.json();
                const tbody = document.getElementById('queueTable');
                tbody.innerHTML = '';
                
                if (data.queue.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="7" class="border p-4 text-center text-gray-500">No farmers registered yet.</td></tr>`;
                    return;
                }

                data.queue.forEach(row => {
                    tbody.innerHTML += `
                        <tr>
                            <td class="border p-2">${row.id}</td>
                            <td class="border p-2">${row.name}</td>
                            <td class="border p-2">${row.crop}</td>
                            <td class="border p-2">${row.quantityKg}</td>
                            <td class="border p-2">${row.slotTime}</td>
                            <td class="border p-2"><span class="bg-blue-100 text-blue-800 px-2 py-1 rounded text-xs">${row.status}</span></td>
                            <td class="border p-2"><span class="bg-orange-100 text-orange-800 px-2 py-1 rounded text-xs">${row.paymentStatus}</span></td>
                        </tr>
                    `;
                });
            } catch (err) {
                console.error("Error loading queue:", err);
            }
        }

        document.getElementById('bookingForm').addEventListener('submit', async (e) => {
            e.preventDefault(); // Stop page reload
            const payload = {
                name: document.getElementById('name').value,
                crop: document.getElementById('crop').value,
                quantityKg: document.getElementById('quantityKg').value,
                slotTime: document.getElementById('slotTime').value
            };

            const response = await fetch('/api/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            const result = await response.json();
            const msgDiv = document.getElementById('msg');
            
            if (result.success) {
                msgDiv.className = "mb-4 text-sm font-semibold text-green-600";
                msgDiv.innerText = "✅ Slot booked successfully!";
                document.getElementById('bookingForm').reset();
                fetchQueue(); // Refresh table immediately
            } else {
                msgDiv.className = "mb-4 text-sm font-semibold text-red-600";
                msgDiv.innerText = "❌ Failed to book slot.";
            }
        });

        // Load queue on page start
        fetchQueue();
    </script>
</body>
</html>
